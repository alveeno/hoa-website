name: Deploy to GitHub Pages

# Builds nothing (static site) and publishes the repository root to GitHub Pages.
# To activate: in the repo, go to Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Then any push to one of the branches below deploys.

on:
  push:
    branches:
      - main
      - claude/vigilant-johnson-f8d0fm
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
