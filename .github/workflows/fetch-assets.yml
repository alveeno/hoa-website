name: Fetch generated assets

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "JSON array of {url, path} objects to download and commit"
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download assets
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          echo "$MANIFEST" | python3 -c '
          import json, os, sys, urllib.request
          items = json.load(sys.stdin)
          for it in items:
              path = it["path"]
              assert ".." not in path and not path.startswith("/"), path
              os.makedirs(os.path.dirname(path), exist_ok=True)
              print("fetching", it["url"], "->", path)
              urllib.request.urlretrieve(it["url"], path)
              print("  size:", os.path.getsize(path))
          '

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add generated hero assets" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
