name: Fetch generated assets

on:
  push:
    branches:
      - claude/arras-wine-bottle-hero-49ehzr
    paths:
      - ".assets-manifest.json"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download assets
        run: |
          python3 -c '
          import json, os, urllib.request
          with open(".assets-manifest.json") as f:
              items = json.load(f)
          for it in items:
              path = it["path"]
              assert ".." not in path and not path.startswith("/"), path
              os.makedirs(os.path.dirname(path), exist_ok=True)
              print("fetching", it["url"], "->", path)
              urllib.request.urlretrieve(it["url"], path)
              print("  size:", os.path.getsize(path))
          '

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add generated hero assets" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
